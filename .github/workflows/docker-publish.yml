name: Build & Publish Docker Image

on:
  # Image built on a v* tag only (tags :x.y.z, :x.y, :x), behind the attestation job.
  push:
    tags: ['v*']
  # Release published: its ref is the tag; adds :latest.
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # AntorFR/music-library

permissions:
  contents: read
  packages: write

jobs:
  # The suite is not played here: `attester --publier` posts the `tests-complets` status.
  attestation:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require tests-complets on this content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arbre=$(git rev-parse 'HEAD^{tree}')
          for c in $(git rev-list --parents -n 1 HEAD); do
            [ "$(git rev-parse "$c^{tree}")" = "$arbre" ] || continue
            st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/status" \
              --jq '.statuses[] | select(.context == "tests-complets") | .state + " " + .description' | head -1)
            [ "${st%% *}" = success ] && { echo "Attestation sur $c : ${st#* }"; exit 0; }
          done
          echo "::error::Pas d'attestation tests-complets sur ce contenu : attester --publier, puis relancer."
          exit 1

  build-and-push:
    needs: attestation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Docker Buildx ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- QEMU for multi-arch ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---- Login to GHCR ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Extract metadata (tags + labels) ----
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On release v0.5.0-beta → :0.5.0-beta, :0.5, :0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # On release → :latest
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # Always → :sha-abc1234
            type=sha,prefix=sha-

      # ---- Build & Push ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
